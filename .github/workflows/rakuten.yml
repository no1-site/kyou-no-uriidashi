name: 楽天商品取得

on:
  workflow_dispatch:
  schedule:
    # 毎日6:00ごろ（日本時間）に実行
    - cron: "0 21 * * *"
  push:
    paths:
      - "scripts/fetch-rakuten.mjs"
      - ".github/workflows/rakuten.yml"

permissions:
  contents: write

concurrency:
  group: rakuten-products
  cancel-in-progress: false

jobs:
  fetch-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: サイトのファイルを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 楽天の商品を取得
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/fetch-rakuten.mjs

      - name: 商品データを確認
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const products = JSON.parse(
            await readFile("products.json", "utf8")
          );

          if (!Array.isArray(products) || products.length === 0) {
            throw new Error("商品データが空です。");
          }

          for (const product of products) {
            if (
              typeof product.name !== "string" ||
              !product.name.trim() ||
              !Number.isFinite(product.price) ||
              product.price <= 0
            ) {
              throw new Error("商品名または価格に不正なデータがあります。");
            }

            const url = new URL(product.best_url);
            if (url.protocol !== "https:") {
              throw new Error("商品URLを確認してください。");
            }
          }

          console.log(`確認成功：${products.length}件`);
          NODE

      - name: 更新した商品データを公開
        run: |
          if git diff --quiet -- products.json; then
            echo "商品データに変更はありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "楽天商品を自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 確認用の商品データを保存
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-products
          path: products.json
          retention-days: 1
          if-no-files-found: error
